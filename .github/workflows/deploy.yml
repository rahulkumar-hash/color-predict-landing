name: Deploy Landing Page

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build Docker & Deploy Landing Page to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Landing Page Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/rahulkumar-hash/color-predict-landing:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '160.191.14.113' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/rahulkumar-hash/color-predict-landing:latest
            docker stop colorpredict-landing || true
            docker rm -f colorpredict-landing || true
            docker run -d \
              --restart always \
              --name colorpredict-landing \
              --network colorpredict-network \
              -p 5003:80 \
              ghcr.io/rahulkumar-hash/color-predict-landing:latest
            docker image prune -f
            echo "✅ Color Prediction Landing Page Successfully Deployed!"

